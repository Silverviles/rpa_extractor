[package]
name = "rpa-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
rpa-lib = { path = "../rpa-lib" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
gdk = { package = "gdk4", version = "0.11.5" }
gdk-pixbuf = { package = "gdk-pixbuf", version = "0.22.0" }
gio = { version = "0.22.10" }
glib = { version = "0.22.10" }
async-channel = "2"

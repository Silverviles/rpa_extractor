[package]
name = "rpa-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
rpa-lib = { path = "../rpa-lib" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gdk = { package = "gdk4", version = "0.9" }
gdk-pixbuf = { package = "gdk-pixbuf", version = "0.20" }
gio = { version = "0.20" }
glib = { version = "0.20" }
async-channel = "2"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
